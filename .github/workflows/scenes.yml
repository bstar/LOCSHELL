name: Embedded scenes
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  real-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      WATCOM: ${{ github.workspace }}/build/toolchains/watcom
      INCLUDE: ${{ github.workspace }}/build/toolchains/watcom/h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Fetch verified Open Watcom SDK
        run: |
          python3 third_party/dos-scenes/tools/fetch_watcom.py --output "$WATCOM"
          echo "$WATCOM/binl64" >> "$GITHUB_PATH"
      - run: nix develop path:./nix#ci --command python tools/build.py
      - run: nix develop path:./nix#ci --command python tools/test_island.py
      - run: nix develop path:./nix#ci --command python tools/build.py --locshell
      - run: nix develop path:./nix#ci --command python tools/test_locshell.py
      - run: python3 tools/test_saves.py
