name: Embedded scenes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  real-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop path:./nix --command python tools/build.py
      - run: nix develop path:./nix --command python tools/test_island.py
